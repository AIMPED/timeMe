services:
  app:
    build: .
    image: timeme:latest
    container_name: timeme
    restart: unless-stopped
    environment:
      TIMEME_SECRET_KEY: ${TIMEME_SECRET_KEY:?set TIMEME_SECRET_KEY in .env}
      TIMEME_TIMEZONE: ${TIMEME_TIMEZONE:-Europe/Berlin}
      TIMEME_DEFAULT_NOMINAL_MINUTES: ${TIMEME_DEFAULT_NOMINAL_MINUTES:-420}
      TIMEME_SESSION_HOURS: ${TIMEME_SESSION_HOURS:-336}
      TIMEME_COOKIE_SECURE: ${TIMEME_COOKIE_SECURE:-true}
      TZ: ${TIMEME_TIMEZONE:-Europe/Berlin}
    volumes:
      - timeme-data:/data
    # Only Caddy on the host needs to reach this; it is not exposed publicly.
    ports:
      - "127.0.0.1:${TIMEME_BIND_PORT:-8787}:8000"

  backup:
    build:
      context: .
      dockerfile: scripts/Dockerfile.backup
    image: timeme-backup:latest
    container_name: timeme-backup
    restart: unless-stopped
    depends_on:
      - app
    environment:
      BACKUP_AT: ${BACKUP_AT:-03:30}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: ${TIMEME_TIMEZONE:-Europe/Berlin}
    # Same uid as the app: sqlite needs to touch the -wal/-shm sidecar files
    # even to read, and root-owned ones would lock the app out of its own DB.
    user: "10001:10001"
    volumes:
      - timeme-data:/data
      - ./backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]

volumes:
  timeme-data:
