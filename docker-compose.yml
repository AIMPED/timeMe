# Production stack. Images are built by CI and pulled from GHCR — there is no
# build stanza on purpose, so the VPS never compiles what it runs. TIMEME_TAG is
# written into .env by scripts/deploy.sh; :latest is only a bootstrap fallback.
#
# To build locally, use docker-compose.local.dev.yml instead.

services:
  app:
    image: ghcr.io/aimped/timeme:${TIMEME_TAG:-latest}
    container_name: timeme
    restart: unless-stopped
    environment:
      TIMEME_SECRET_KEY: ${TIMEME_SECRET_KEY:?set TIMEME_SECRET_KEY in .env}
      TIMEME_TIMEZONE: ${TIMEME_TIMEZONE:-Europe/Berlin}
      TIMEME_DEFAULT_NOMINAL_MINUTES: ${TIMEME_DEFAULT_NOMINAL_MINUTES:-420}
      TIMEME_SESSION_HOURS: ${TIMEME_SESSION_HOURS:-336}
      TIMEME_COOKIE_SECURE: ${TIMEME_COOKIE_SECURE:-true}
      TZ: ${TIMEME_TIMEZONE:-Europe/Berlin}
    volumes:
      - timeme-data:/data
    # Only Caddy on the host needs to reach this; it is not exposed publicly.
    ports:
      - "127.0.0.1:${TIMEME_BIND_PORT:-8787}:8000"
    networks:
      - default
      - web

  backup:
    image: ghcr.io/aimped/timeme-backup:${TIMEME_TAG:-latest}
    container_name: timeme-backup
    restart: unless-stopped
    depends_on:
      - app
    environment:
      BACKUP_AT: ${BACKUP_AT:-03:30}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: ${TIMEME_TIMEZONE:-Europe/Berlin}
    # Same uid as the app: sqlite needs to touch the -wal/-shm sidecar files
    # even to read, and root-owned ones would lock the app out of its own DB.
    user: "10001:10001"
    # backup.sh is baked into the image, so the VPS needs only this file, .env
    # and a backups/ directory — no source checkout.
    volumes:
      - timeme-data:/data
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]

networks:
  web:
    external: true

volumes:
  timeme-data:
